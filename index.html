/* Layout: one column app shell, max 1120px, sticky header, views switched by hash */
:root{
  --bg:#FFFFFF; --bg-soft:#F4F6F9; --surface:#FFFFFF; --fg:#16202E; --fg-2:#3E4A5C; --fg-3:#5A6577;
  --line:#DDE3EA; --line-2:#C5CED9; --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E8EEF6; --accent-strong:#163A6A;
  --ok-bg:#E7F2EB; --ok-fg:#1B5E36; --mute-bg:#EEF1F4; --warn-bg:#FDF1E3; --warn-fg:#8A4B08; --band:#16202E; --band-fg:#FFFFFF; --band-fg-2:#C9D2DE;
  --serif:'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  --sans:'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161F; --bg-soft:#161E2A; --surface:#1A2330; --fg:#E7ECF2; --fg-2:#B7C2D0; --fg-3:#9AA6B5;
  --line:#2C3746; --line-2:#3A475A; --accent:#7FA9E0; --accent-ink:#0E1621; --accent-soft:#22324A; --accent-strong:#A9C6EE;
  --ok-bg:#163326; --ok-fg:#8FD3AA; --mute-bg:#242E3B; --warn-bg:#3A2A14; --warn-fg:#F2C08A; --band:#0B1017; --band-fg:#E7ECF2; --band-fg-2:#9FB0C4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161F; --bg-soft:#161E2A; --surface:#1A2330; --fg:#E7ECF2; --fg-2:#B7C2D0; --fg-3:#9AA6B5;
  --line:#2C3746; --line-2:#3A475A; --accent:#7FA9E0; --accent-ink:#0E1621; --accent-soft:#22324A; --accent-strong:#A9C6EE;
  --ok-bg:#163326; --ok-fg:#8FD3AA; --mute-bg:#242E3B; --warn-bg:#3A2A14; --warn-fg:#F2C08A; --band:#0B1017; --band-fg:#E7ECF2; --band-fg-2:#9FB0C4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
h1,h2{font-family:var(--serif);font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:.03em}
.brand small{display:block;font-size:11.5px;color:var(--fg-3);letter-spacing:.06em}
nav.main{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;font-size:14px}
nav.main a{color:var(--fg);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
nav.main a[aria-current="page"]{color:var(--accent);font-weight:700}
.cartpill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink)!important;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;border:1px solid var(--accent);background:var(--surface);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line-2);color:var(--fg);font-weight:500}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:12.5px;letter-spacing:.16em;color:var(--accent);font-weight:500}
.lead{color:var(--fg-2);font-size:16px;max-width:680px}
.muted{color:var(--fg-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--fg-3)}
section.band{border-bottom:1px solid var(--line)} section.soft{background:var(--bg-soft)}
.pad{padding-block:56px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.tile{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.tile:hover{border-color:var(--accent)}
.mark{width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--accent)}
.badge{display:inline-flex;align-items:center;font-size:12px;padding:2px 10px;border-radius:2px;font-weight:500;white-space:nowrap}
.b-open{background:var(--ok-bg);color:var(--ok-fg)} .b-closed{background:var(--mute-bg);color:var(--fg-2)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)} .b-info{background:var(--accent-soft);color:var(--accent-strong)}
.b-line{border:1px solid var(--line-2);color:var(--fg-2)}
.b-sample{border:1px dashed var(--line-2);color:var(--fg-3)}
.tag{font-size:11px;padding:0 6px;border-radius:2px;font-weight:500}
.tag.pub{border:1px solid var(--accent);color:var(--accent)} .tag.own{border:1px solid var(--fg-3);color:var(--fg-2)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg-2);font:inherit;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:14px;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;min-height:44px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:88px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400;min-height:34px}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
fieldset{margin:0;border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
legend{font-size:13px;font-weight:700;padding:0 6px}
.split{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.split>.main{flex:999 1 560px;min-width:0}
.split>.side{flex:1 1 280px;min-width:0}
.result{display:flex;flex-direction:column;gap:14px}
.result h3{font-family:var(--serif);font-size:20px}
.result h3 a{color:var(--fg);text-decoration:none}
dl.facts{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
dl.facts dt{font-size:12px;color:var(--fg-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
dl.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg-2)}
.cartbar{position:sticky;bottom:0;background:var(--band);color:var(--band-fg);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
.cartbar .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding-block:12px}
.cartbar .btn{background:var(--band-fg);color:var(--band);border-color:var(--band-fg)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.stages button{min-height:68px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;text-align:left;padding:10px 16px;cursor:pointer}
.stages button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.stages small{display:block;font-size:12px;letter-spacing:.06em}
.stages b{display:block;font-size:15px}
table.inbox{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
table.inbox th{text-align:left;font-size:12px;color:var(--fg-2);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
table.inbox td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:28px;text-align:center;color:var(--fg-2)}
.reqcard{display:flex;flex-direction:column;gap:12px}
.recip{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.reply{background:var(--bg-soft);border-radius:6px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.ready-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.bar{height:6px;background:var(--mute-bg);border-radius:3px}.bar>i{display:block;height:6px;border-radius:3px;background:var(--accent)}
.principles{border-top:2px solid var(--fg)}
.banner{background:var(--warn-bg);color:var(--warn-fg);font-size:13px;padding:10px 0}
footer{padding-block:36px;font-size:13px;color:var(--fg-2)}
.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.45}
.sec-h{display:flex;flex-direction:column;gap:8px}
.sec-h h2{font-size:clamp(24px,3.4vw,30px)}
.err{color:var(--warn-fg);font-size:13px}
.article{max-width:780px}
.article h2{font-size:22px;margin-top:8px}
.article p{line-height:1.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{border-top:2px solid var(--fg);padding-top:10px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums}
.chartbox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px}
.chartbox svg{display:block;width:100%;min-width:600px;height:auto}
.chartbox figcaption{font-size:12px;color:var(--fg-3);margin-top:6px}
table.plain{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.plain th,table.plain td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.plain th{font-size:12px;color:var(--fg-2);font-weight:500}
table.plain td.n,table.plain th.n{text-align:right;font-variant-numeric:tabular-nums}
.colcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--fg)}
.colcard:hover h3{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:border-color .15s,background-color .15s}}
</style>

 return false;}

function updCalc(){var a=document.getElementById('calcSize'),b=document.getElementById('calcBand'),h=document.getElementById('calcHours'),o=document.getElementById('calcOut');if(!a||!b||!h||!o)return;
 S.ui.calc={size:a.value,band:Number(b.value),hours:h.value};o.textContent=calcText();}
document.addEventListener('input',function(e){if(e.target.getAttribute&&e.target.getAttribute('data-act')==='calc'){updCalc();return;}if(e.target.id==='kw'){S.ui.kw=e.target.value;clearTimeout(kwTimer);kwTimer=setTimeout(function(){var pos=e.target.selectionStart;render();var k=document.getElementById('kw');if(k){k.focus();try{k.setSelectionRange(pos,pos);}catch(x){}}},250);}});
document.addEventListener('submit',function(e){
 e.preventDefault();var f=e.target;
 if(f.id==='consultForm')submitConsult(f);
 else if(f.id==='regForm'){
  var msg=document.getElementById('regMsg');var name=document.getElementById('g_name').value.trim();if(!name){msg.textContent='正式名称を入力してください。';return;}
  if(!S.db||!S.uid){msg.textContent='この表示では登録できません。';return;}
  var id=newId('p');var doc={type:document.getElementById('g_type').value,name:name,place:document.getElementById('g_place').value.trim(),area:document.getElementById('g_area').value,size:document.getElementById('g_size').value,capacity:document.getElementById('g_cap').value.trim(),intakeOpen:document.getElementById('g_open').checked,services:[],strength:'',profile:'',publicFacts:[],ownerId:S.uid,isSample:false,updatedAt:new Date().toISOString(),createdAt:new Date().toISOString()};
  f.querySelector('button[type=submit]').disabled=true;
  S.db.doc('providers/'+id).set(doc).then(function(){S.ui.register=false;S.ui.dashPid=id;lsSet('ipo.dash',id);render();},function(err){f.querySelector('button[type=submit]').disabled=false;msg.textContent=err&&err.code==='quota_exceeded'?'登録できる件数の上限に達しました。':'登録できませんでした。もう一度お試しください。';});
 }
 else if(f.id==='introForm'){
  var ip=byId(f.getAttribute('data-id')),im=document.getElementById('inMsg');if(!ip)return;
  if(!S.db||!S.uid){im.textContent='紹介の依頼は、サインインしている方だけが送れます。';return;}
  var d={providerId:ip.id,providerName:ip.name,companyName:document.getElementById('in_co').value.trim(),contactName:document.getElementById('in_name').value.trim(),contact:document.getElementById('in_contact').value.trim(),message:document.getElementById('in_msg').value.trim(),createdBy:S.uid||null,createdAt:new Date().toISOString()};
  if(!d.companyName||!d.contactName||!d.contact){im.textContent='会社名・お名前・連絡先を入力してください。';return;}
  f.querySelector('button[type=submit]').disabled=true;
  var ref=S.db.doc('intros/'+S.uid);ref.get().then(function(snap){var old=(snap&&snap.exists&&snap.data().items)||[];return ref.set({items:old.concat([d]),updatedAt:d.createdAt});}).then(function(){S.ui.introSent=ip.id;render();},function(){f.querySelector('button[type=submit]').disabled=false;im.textContent='送信できませんでした。もう一度お試しください。';});
 }
 else if(f.id==='peopleForm'){
  var pid2=f.getAttribute('data-id'),idx=Number(f.getAttribute('data-idx')),pm=document.getElementById('ppMsg'),pr=byId(pid2);if(!S.db||!pr)return;
  function v(id){return document.getElementById(id).value.trim();}
  var person={name:v('pp_name'),title:v('pp_title'),origin:document.getElementById('pp_origin').value,ipo:v('pp_ipo'),originDetail:v('pp_od'),career:v('pp_career'),focus:v('pp_focus'),msg:v('pp_msg'),consent:document.getElementById('pp_consent').checked,source:isReg(pr)&&pr.ownerId===S.uid?'self':'operator',updatedAt:new Date().toISOString()};
  if(!person.name){pm.textContent='氏名を入力してください。';return;}
  if(!person.consent){pm.textContent='本人の掲載同意を確認してから保存してください。';return;}
  var arr2=(pr.people||[]).slice();if(idx>=0&&arr2[idx])arr2[idx]=person;else arr2.push(person);
  f.querySelector('button[type=submit]').disabled=true;
  S.db.doc('providers/'+pid2).update({people:arr2}).then(function(){S.ui.pEdit=-1;render();},function(){f.querySelector('button[type=submit]').disabled=false;pm.textContent='保存できませんでした。もう一度お試しください。';});
 }
 else if(f.id==='editForm'){
  var pid=f.getAttribute('data-id'),m=document.getElementById('editMsg');if(!S.db)return;
  var svc=[].slice.call(f.querySelectorAll('.e_svc:checked')).map(function(x){return x.value;});
  var upd={capacity:document.getElementById('e_cap').value.trim(),area:document.getElementById('e_area').value,strength:document.getElementById('e_str').value.trim(),profile:document.getElementById('e_prof').value.trim(),services:svc,updatedAt:new Date().toISOString()};
  [].slice.call(f.querySelectorAll('input[type=text],textarea')).forEach(function(x){x.defaultValue=x.value;});
  S.db.doc('providers/'+pid).update(upd).then(function(){m.textContent='保存しました。';},function(){m.textContent='保存できませんでした。もう一度お試しください。';});
 }
});
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

/* ---------- boot ---------- */
function waitClaude(ms){return new Promise(function(res){var t0=Date.now();(function tick(){if(window.claude&&typeof window.claude.use==='function')return res(window.claude);if(Date.now()-t0>ms)return res(null);setTimeout(tick,100);})();});}
function boot(){
 loadLocal();render();
 waitClaude(4000).then(function(c){
  if(!c){S.dbState='none';S.reqState='none';schedule();return;}
  return Promise.all([c.use('db'),c.use('user')]).then(function(r){
   var db=r[0],user=r[1];
   var who=user?Promise.all([user.id(),user.canEdit()]):Promise.resolve([null,false]);
   return who.then(function(w){
    S.uid=w[0];S.canEdit=!!w[1];
    if(!db){S.dbState='none';S.reqState='none';schedule();return;}
    S.db=db;
    db.collection('providers').onSnapshot(function(snap){S.providers=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x;});S.dbState='ok';schedule();},function(){S.dbState='error';schedule();});
    if(S.canEdit)db.collection('intros').limit(500).onSnapshot(function(snap){var all=[];snap.docs.forEach(function(d){(d.data().items||[]).forEach(function(x){all.push(x);});});all.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));});S.intros=all;schedule();},function(){});
    db.collection('requests').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){S.requests=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x;});S.reqState='ok';schedule();},function(){S.reqState='error';schedule();});
   });
  });
 }).catch(function(){S.dbState='error';schedule();});
}
boot();
})();
</script>
